<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris Boddy — Copywriting, narrative and voice strategy</title>
<meta name="description" content="Chris Boddy. Copywriting, narrative and voice strategy.">
<link rel="stylesheet" href="site.css">
<style>
  /* the site is the field, full bleed */
  .stage{position:fixed; inset:0}
</style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="type">
      <h1>Chris Boddy.</h1>
      <p>Copywriting, narrative<br>and voice strategy.</p>
    </div>
  </main>

  <script src="field.js"></script>
  <script>
    (function(){
      const field = DispersionField.create(
        document.getElementById('gl'), document.getElementById('stage'));
      if(!field){
        document.getElementById('stage').insertAdjacentHTML('beforeend',
          '<p class="fail">This background needs WebGL2, which this browser has ' +
          'turned off or does not support.</p>');
      }
    })();
  </script>
</body>
</html>
